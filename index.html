<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>情绪自测表</title><link rel="stylesheet" href="./assets/style.css"></head><body><main class="app"><header><h1>情绪自测表</h1><p>请根据过去两周的真实感受作答，没有标准答案。</p></header><form id="testForm"></form><section class="contact"><label for="wechat">微号</label><input id="wechat" type="text" maxlength="80" placeholder="填写微号（可选）"><label for="tel">TEL</label><input id="tel" type="tel" maxlength="30" placeholder="填写电话（可选）"></section><section class="extra"><label for="note">最近最让你困扰的事情（可选）</label><textarea id="note" rows="4" maxlength="500" placeholder="写下你想补充的内容"></textarea></section><button id="submit" type="button">查看我的得分</button><button id="copy" class="copy" type="button" hidden>一键复制测试结果</button><section id="result" class="result" hidden></section><p class="disclaimer">本测评仅用于辅助了解近期状态，不代表心理诊断。若情绪困扰持续或明显影响生活，请寻求专业帮助。</p></main><script src="./assets/main.js"></script></body></html>
